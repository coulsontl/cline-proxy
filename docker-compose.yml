version: "3.9"

services:
  cline-proxy:
    build: .
    container_name: cline-proxy
    restart: unless-stopped
    ports:
      - "3457:3457"
    volumes:
      # 账号池与统计记录均持久化在 data 目录（SQLite stats.db）
      - ./data:/app/data
      - ./override.md:/app/override.md:ro
    environment:
      - PORT=3457
